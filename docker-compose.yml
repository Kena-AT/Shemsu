services:
  postgres:
    image: postgres:15-alpine
    container_name: shemsu_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Kunta1011#
      POSTGRES_DB: shemsu_db
    ports:
      - "4411:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shemsu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
