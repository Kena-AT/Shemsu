name: Keep Render Instance Warm

on:
  schedule:
    # Run every 14 minutes to prevent Render's 15-minute spin-down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual triggering for verification

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Shemsu API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://shemsu.onrender.com/health)
          echo "Ping Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "API is not responding with 200 OK"
            exit 1
          fi
